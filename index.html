<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Smart Duka · Invoices, Quotations & Receipts</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0B0B; --s1: #0C1310; --s2: #121A14; --s3: #182019;
a      --gold: #C8883A; --gold2: #E9B96E; --gold3: rgba(200,136,58,0.12);
      --em: #0A9167; --em2: #34D399; --rose: #E54562; --sapp: #4A9EDF;
      --text: #EDF0EE; --text2: #C8D4CB; --muted: #526659; --muted2: #8CA396;
      --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Outfit', system-ui, sans-serif;
      --r: 20px; --r2: 14px; --r3: 10px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:var(--sans);background:#050807;color:var(--text);min-height:100vh;overflow-x:hidden}
    #app{max-width:100%;margin:0 auto;position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
    .orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
    .orb1{width:380px;height:380px;background:radial-gradient(circle,rgba(200,136,58,0.10) 0%,transparent 70%);top:-120px;right:-100px;filter:blur(40px)}
    .orb2{width:280px;height:280px;background:radial-gradient(circle,rgba(10,145,103,0.08) 0%,transparent 70%);bottom:80px;left:-80px;filter:blur(40px)}
    .orb3{width:200px;height:200px;background:radial-gradient(circle,rgba(200,136,58,0.05) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);filter:blur(60px)}
    #hdr{padding:20px 22px 16px;background:linear-gradient(to bottom,rgba(5,8,7,0.98) 50%,transparent);position:sticky;top:0;z-index:20;backdrop-filter:blur(32px)}
    .hdr-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .brand-eye{font-size:9px;font-weight:600;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
    .brand-name{font-family:var(--serif);font-size:28px;line-height:1;font-weight:400;color:var(--text)}
    .brand-name em{color:var(--gold);font-style:italic}
    .header-buttons{display:flex;gap:8px;align-items:center}
    .settings-btn{width:38px;height:38px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:50%;cursor:pointer;color:var(--muted2);display:flex;align-items:center;justify-content:center;font-size:18px}
    .report-btn{display:flex;align-items:center;gap:6px;background:rgba(200,136,58,0.12);border:1px solid rgba(200,136,58,0.3);color:var(--gold2);border-radius:100px;padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer}
    .logout-btn{width:38px;height:38px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);border-radius:50%;cursor:pointer;color:var(--muted2);display:flex;align-items:center;justify-content:center}
    #content{flex:1;padding:4px 16px 108px}
    @media(min-width:768px){#content{padding:4px 32px 40px}}
    .pane{display:none;flex-direction:column;gap:13px;padding-top:6px}
    .pane.on{display:flex;animation:su .42s cubic-bezier(.22,1,.36,1)}
    @keyframes su{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
    .hero{background:linear-gradient(150deg,rgba(22,34,25,0.82),rgba(10,18,9,0.78));border:1px solid rgba(200,136,58,0.20);border-radius:26px;padding:26px 24px}
    @media(min-width:768px){.hero{padding:32px}}
    .hero-label{font-size:9.5px;font-weight:600;letter-spacing:4px;color:var(--muted2);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .hero-label::before{content:'';display:block;width:14px;height:1px;background:var(--gold);opacity:0.5}
    .hero-num{font-family:var(--serif);font-size:58px;line-height:1;letter-spacing:-2px;color:var(--text);display:flex;align-items:baseline;gap:8px}
    .hero-cur{font-family:var(--sans);font-size:16px;color:var(--muted2);font-weight:300}
    .hero-row{margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:5px 13px;font-size:12px;font-weight:600}
    .pill.pos{background:rgba(10,145,103,.12);border:1px solid rgba(52,211,153,.18);color:var(--em2)}
    .pill.neg{background:rgba(229,69,98,.10);border:1px solid rgba(229,69,98,.2);color:#FB8097}
    .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(min-width:768px){.sgrid{grid-template-columns:repeat(4,1fr)}}
    .sc{background:rgba(12,19,16,0.75);border:1px solid var(--border);border-radius:var(--r);padding:17px 16px}
    .sc-ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:14px;background:rgba(200,136,58,0.10)}
    .sc-val{font-family:var(--serif);font-size:20px;margin-bottom:4px;font-weight:500}
    .sc-lbl{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
    .card{background:rgba(12,19,16,0.75);border:1px solid var(--border);border-radius:var(--r);padding:20px}
    @media(min-width:768px){.card{padding:24px}}
    .sec-lbl{font-size:9px;font-weight:700;letter-spacing:3.5px;color:var(--muted);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
    .split-row{display:flex;align-items:center;gap:20px}
    .leg{flex:1;display:flex;flex-direction:column;gap:13px}
    .leg-item{display:flex;align-items:center;justify-content:space-between}
    .leg-left{display:flex;align-items:center;gap:10px}
    .leg-dot{width:7px;height:7px;border-radius:50%}
    .leg-name{font-size:12px;color:var(--muted2);font-weight:500}
    .leg-val{font-family:var(--serif);font-size:18px;font-weight:500}
    .leg-pct{font-size:10px;color:var(--muted);font-weight:600;background:var(--s2);border-radius:100px;padding:2px 7px}
    .bars{display:flex;align-items:flex-end;gap:7px;height:80px;margin-top:8px}
    .bcol{display:flex;flex-direction:column;align-items:center;flex:1;height:100%}
    .bbg{width:100%;flex:1;display:flex;align-items:flex-end}
    .bfill{width:100%;border-radius:6px 6px 2px 2px;background:var(--s2);border:1px solid rgba(255,255,255,0.04);transition:height .7s;min-height:4px}
    .bfill.today{background:linear-gradient(to bottom,var(--gold),rgba(200,136,58,0.45))}
    .bday{font-size:8.5px;color:var(--muted);margin-top:6px;font-weight:500}
    .bday.today{color:var(--gold);font-weight:700}
    .rec-card{background:rgba(12,19,16,0.75);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
    .rec-hdr{padding:18px 20px 0}
    .srow{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--border);gap:12px}
    .sname{font-size:13.5px;font-weight:500;margin-bottom:5px}
    .sbadge{display:inline-flex;align-items:center;gap:4px;border-radius:100px;padding:3px 10px;font-size:10px;font-weight:700}
    .sbadge.mpesa{background:rgba(10,145,103,.10);border:1px solid rgba(10,145,103,.2);color:var(--em2)}
    .sbadge.cash{background:rgba(200,136,58,.10);border:1px solid rgba(200,136,58,.2);color:var(--gold2)}
    .sbadge.credit{background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.22);color:#FCD34D}
    .samt{font-family:var(--serif);font-size:20px;font-weight:500;flex-shrink:0}
    .phdr{display:flex;justify-content:space-between;align-items:center;padding:6px 0 2px;gap:12px;flex-wrap:wrap}
    .ptotal{font-family:var(--serif);font-size:34px;font-weight:400;letter-spacing:-0.5px}
    .plbl{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:5px;font-weight:600}
    .addbtn{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--border2);color:var(--text2);border-radius:100px;padding:10px 18px;font-size:12.5px;font-weight:600;cursor:pointer}
    .litem{background:rgba(12,19,16,0.75);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:9px}
    @media(min-width:768px){.litem{padding:20px}}
    .iname{font-size:14px;font-weight:600;margin-bottom:7px}
    .delete-btn{background:rgba(229,69,98,0.1);border:1px solid rgba(229,69,98,0.2);color:#FB8097;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer}
    .restock-btn{background:rgba(10,145,103,0.10);border:1px solid rgba(10,145,103,0.25);color:var(--em2);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700;cursor:pointer;margin-left:6px}
    #nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(8,12,10,0.85);backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,0.08);border-radius:26px;padding:8px;display:flex;gap:2px;width:calc(100% - 32px);max-width:98vw;overflow-x:auto;flex-wrap:nowrap}
    @media(min-width:768px){
      #nav{position:sticky;top:0;z-index:15;margin-bottom:24px;width:100%;max-width:100%;border-radius:0;border-left:none;border-right:none;border-top:none;background:rgba(5,8,7,0.9);padding:0 24px;justify-content:center;flex-wrap:wrap;overflow-x:visible}
      #nav .nitem{padding:12px 20px;font-size:11px;gap:6px;flex-shrink:0}
    }
    .nitem{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;background:none;border:none;color:var(--muted);font-size:7.5px;font-weight:600;text-transform:uppercase;cursor:pointer;border-radius:16px;min-width:fit-content}
    .nitem.on{color:var(--gold);background:rgba(200,136,58,0.09)}
    .nico{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:16px}
    #fab{position:fixed;bottom:88px;right:18px;z-index:25;width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--gold),#A86E28);border:none;color:#0A0600;font-size:26px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(200,136,58,0.38)}
    @media(min-width:768px){#fab{display:none !important}}
    .moverlay{position:fixed;inset:0;z-index:50;background:transparent;display:none;align-items:center;justify-content:center}
    .moverlay.on{display:flex;background:rgba(0,0,0,.85);backdrop-filter:blur(8px)}
    .msheet{background:rgba(10,15,11,0.96);width:100%;max-width:430px;border-radius:28px 28px 0 0;border-top:1px solid rgba(255,255,255,0.08);padding:0 22px 48px;max-height:92vh;overflow-y:auto}
    @media(min-width:768px){.msheet{border-radius:28px;width:480px;max-width:90vw;margin:auto}}
    .mhandle{width:36px;height:3px;background:rgba(255,255,255,0.12);border-radius:2px;margin:14px auto 24px}
    .mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    .mtitle{font-family:var(--serif);font-size:26px;font-weight:400}
    .mclose{width:34px;height:34px;border-radius:50%;background:var(--s2);border:1px solid var(--border);color:var(--muted2);display:flex;align-items:center;justify-content:center;cursor:pointer}
    .fld{margin-bottom:17px}
    .fld label{display:block;font-size:9.5px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:9px}
    .fld input,.fld select{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r2);padding:15px 17px;color:var(--text);font-size:15px;outline:none}
    .ptog-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .popt-3{padding:13px 8px;border-radius:14px;border:1.5px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.025);color:var(--muted2);font-size:12px;font-weight:600;cursor:pointer;text-align:center}
    .popt-3.sc{border-color:rgba(200,136,58,0.50);background:linear-gradient(145deg,rgba(200,136,58,0.12),rgba(200,136,58,0.05));color:var(--gold2)}
    .popt-3.sm{border-color:rgba(10,145,103,0.50);background:linear-gradient(145deg,rgba(10,145,103,0.12),rgba(10,145,103,0.05));color:var(--em2)}
    .popt-3.sd{border-color:rgba(245,158,11,0.50);background:linear-gradient(145deg,rgba(245,158,11,0.10),rgba(245,158,11,0.04));color:#FCD34D}
    .debt-notice{display:none;align-items:center;gap:9px;background:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(245,158,11,0.04));border:1px solid rgba(245,158,11,0.22);border-radius:12px;padding:11px 14px;font-size:12px;color:#FCD34D;margin-top:2px}
    .record-sale-btn{width:100%;padding:16px;border-radius:16px;border:none;font-size:15px;font-weight:700;background:linear-gradient(135deg,#0A9167,#076B4E);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;cursor:pointer}
    .stock-info-banner{display:none;align-items:center;gap:9px;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:600;margin-bottom:14px;border:1px solid}
    .stock-info-banner.ok{background:rgba(10,145,103,0.07);border-color:rgba(10,145,103,0.2);color:var(--em2)}
    .qty-input-wrap{display:flex;align-items:stretch;gap:8px}
    .qty-unit-label{font-size:13px;font-weight:700;color:var(--gold2);background:rgba(200,136,58,0.10);border:1px solid rgba(200,136,58,0.22);border-radius:14px;padding:0 14px;display:flex;align-items:center}
    .prod-suggestions{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);background:rgba(10,15,11,0.98);border:1px solid rgba(255,255,255,0.10);border-radius:14px;z-index:100;max-height:220px;overflow-y:auto}
    .psi{padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between}
    .customer-input-group{margin-bottom:20px}
    .customer-input-group label{font-size:9px;font-weight:700;letter-spacing:2.5px;color:rgba(140,163,150,0.85);text-transform:uppercase;margin-bottom:6px;display:block}
    .customer-input-group input{width:100%;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px 16px;color:var(--text)}
    .fld-sale-pos{position:relative}
    .unit-select-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .unit-opt{padding:10px 4px;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;color:var(--muted2);font-size:12px;font-weight:700;cursor:pointer;text-align:center}
    .unit-opt.selected{border-color:rgba(200,136,58,0.55);background:rgba(200,136,58,0.10);color:var(--gold2)}
    .sale-action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
    .sale-action-btn{padding:14px 10px;border-radius:14px;border:1.5px solid;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
    .sale-action-btn.update{background:linear-gradient(145deg,rgba(10,145,103,0.15),rgba(10,145,103,0.06));border-color:rgba(10,145,103,0.35);color:var(--em2)}
    .sale-action-btn.danger{background:linear-gradient(145deg,rgba(229,69,98,0.12),rgba(229,69,98,0.05));border-color:rgba(229,69,98,0.30);color:#FB8097}
    .sale-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);margin:18px 0}
    /* Document Line Items */
    .line-item-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
    .line-item-row input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:var(--r3);padding:10px 12px;color:var(--text);font-size:13px}
    .line-item-row button{background:var(--rose);border:none;color:white;border-radius:var(--r3);padding:8px 12px;font-weight:700;cursor:pointer}
    .add-line-btn{background:rgba(10,145,103,0.15);border:1px solid rgba(10,145,103,0.3);color:var(--em2);border-radius:var(--r3);padding:8px 14px;font-weight:700;cursor:pointer;margin-top:8px;display:inline-block}
    .cust-item{background:rgba(12,19,16,0.75);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;overflow:hidden;transition:all .2s}
    .cust-item.has-debt{border-left:3px solid var(--rose)}
    .cust-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;cursor:pointer}
    .cust-header:active{background:rgba(255,255,255,0.02)}
    .cust-header-left{flex:1}
    .cust-name-header{font-size:16px;font-weight:700;color:var(--gold2);margin-bottom:4px}
    .cust-phone-header{font-size:11px;color:var(--muted2)}
    .cust-balance-badge{text-align:right}
    .cust-bal-num{font-family:var(--serif);font-size:26px;font-weight:500}
    .cust-bal-num.debt{color:#FB8097}
    .cust-bal-num.clear{color:var(--em2)}
    .cust-bal-lbl{font-size:9px;color:var(--muted);text-transform:uppercase}
    .expand-icon{font-size:20px;margin-left:12px;color:var(--muted2);transition:transform 0.2s}
    .cust-item.expanded .expand-icon{transform:rotate(180deg)}
    .cust-details{display:none;padding:0 18px 18px;border-top:1px solid var(--border);background:rgba(0,0,0,0.2)}
    .cust-item.expanded .cust-details{display:block}
    .balance-preview{font-size:13px;font-weight:600;margin:12px 0 6px;padding:8px 12px;background:rgba(0,0,0,0.3);border-radius:12px;text-align:center}
    .balance-preview.debt{color:#FB8097}
    .balance-preview.clear{color:var(--em2)}
    .overdue-row{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.25);border-radius:12px;padding:8px 12px;margin:8px 0}
    .overdue-label{font-size:11px;color:var(--muted2)}
    .overdue-days{font-weight:700;font-size:14px}
    .overdue-days.severe{color:#FB8097}
    .cal-icon{cursor:pointer;background:rgba(74,158,223,0.2);border-radius:20px;padding:4px 8px;font-size:11px;color:#7AB8E8}
    .history-log{margin-top:12px;background:rgba(0,0,0,0.3);border-radius:12px;padding:10px;font-size:10px;max-height:120px;overflow-y:auto}
    .history-title{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
    .history-entry{font-family:monospace;font-size:9px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05);color:var(--muted2)}
    .history-entry span{color:var(--gold2)}
    .overdue-badge{font-size:9px;background:rgba(229,69,98,0.2);color:#FB8097;border-radius:20px;padding:2px 8px;display:inline-block;margin-left:8px;font-weight:600}
    .overdue-badge.severe{background:#E54562;color:white}
    .filter-dropdown{width:100%;background:rgba(12,19,16,0.9);border:1px solid var(--border);border-radius:60px;padding:12px 16px;color:var(--text);font-size:14px;margin-bottom:18px;cursor:pointer}
    .cust-search-box{display:flex;gap:10px;background:rgba(12,19,16,0.75);border:1px solid var(--border);border-radius:var(--r2);padding:8px 14px;margin-bottom:16px}
    .cust-search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px}
    .cust-alert-banner{display:none;background:rgba(229,69,98,0.08);border:1px solid rgba(229,69,98,0.2);border-radius:var(--r2);padding:10px 14px;font-size:12px;color:#FB8097;margin-bottom:14px}
    .cust-alert-banner.show{display:block}
    .empty-state{text-align:center;padding:40px 20px;color:var(--muted2);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
    .txn-filter-bar{display:flex;gap:12px;margin-bottom:20px}
    .txn-filter-bar input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:40px;padding:10px 14px;color:var(--text);font-size:13px;outline:none}
    .txn-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
    .txn-left{flex:1}
    .txn-cust-name{font-weight:700;color:var(--gold2);font-size:13px}
    .txn-date{font-size:9px;color:var(--muted);margin-top:4px}
    .txn-note{font-size:10px;color:var(--muted2);margin-top:2px}

<script>
// ========== GLOBALS & EXISTING LOGIC (unchanged) ==========
// ... (all previous variables and functions remain, plus the new ones below)

// ========== NEW DOCUMENT STORES ==========
let invoices = [], quotations = [], receipts = [];

// extend loadData() to also fetch these stores
async function loadData() {
  products = await getAll('products');
  sales = await getAll('sales');
  expenses = await getAll('expenses');
  customers = await getAll('customers');
  customerTransactions = await getAll('customerTransactions');
  invoices = await getAll('invoices');
  quotations = await getAll('quotations');
  receipts = await getAll('receipts');
}

// extend openUserDB() to create the new stores
// inside r.onupgradeneeded:
// if(!db.objectStoreNames.contains('invoices')) db.createObjectStore('invoices',{keyPath:'id',autoIncrement:true});
// if(!db.objectStoreNames.contains('quotations')) db.createObjectStore('quotations',{keyPath:'id',autoIncrement:true});
// if(!db.objectStoreNames.contains('receipts')) db.createObjectStore('receipts',{keyPath:'id',autoIncrement:true});

// ========== RENDER FUNCTIONS ==========
function renderInvoices() {
  const total = invoices.reduce((s,i)=>s+(i.total||0),0);
  document.getElementById('inv-total').textContent = 'KES '+total.toLocaleString();
  const list = document.getElementById('invoices-list');
  if(!invoices.length) { list.innerHTML = '<div class="empty-state">No invoices yet</div>'; return; }
  list.innerHTML = invoices.map(inv=>`
    <div class="litem">
      <div class="iname">Invoice #${inv.id} — ${escapeHtml(inv.customerName||'Unknown')}</div>
      <div>${new Date(inv.date).toLocaleDateString()} · Due ${inv.dueDate?new Date(inv.dueDate).toLocaleDateString():'N/A'} · <strong>${inv.status}</strong></div>
      <div class="samt">KES ${inv.total.toLocaleString()}</div>
      <button class="delete-btn" onclick="deleteInvoice(${inv.id})">Delete</button>
    </div>
  `).join('');
}
function renderQuotations() {
  const total = quotations.reduce((s,q)=>s+(q.total||0),0);
  document.getElementById('quot-total').textContent = 'KES '+total.toLocaleString();
  const list = document.getElementById('quotations-list');
  if(!quotations.length) { list.innerHTML = '<div class="empty-state">No quotations yet</div>'; return; }
  list.innerHTML = quotations.map(q=>`
    <div class="litem">
      <div class="iname">Quote #${q.id} — ${escapeHtml(q.customerName||'Unknown')}</div>
      <div>${new Date(q.date).toLocaleDateString()} · Valid until ${q.validUntil?new Date(q.validUntil).toLocaleDateString():'N/A'}</div>
      <div class="samt">KES ${q.total.toLocaleString()}</div>
      <button class="delete-btn" onclick="deleteQuotation(${q.id})">Delete</button>
    </div>
  `).join('');
}
function renderReceipts() {
  const total = receipts.reduce((s,r)=>s+(r.amount||0),0);
  document.getElementById('rec-total').textContent = 'KES '+total.toLocaleString();
  const list = document.getElementById('receipts-list');
  if(!receipts.length) { list.innerHTML = '<div class="empty-state">No receipts yet</div>'; return; }
  list.innerHTML = receipts.map(r=>`
    <div class="litem">
      <div class="iname">Receipt #${r.id} — ${escapeHtml(r.customerName||'Unknown')}</div>
      <div>${new Date(r.date).toLocaleDateString()} · ${r.method} · ${escapeHtml(r.note||'')}</div>
      <div class="samt">KES ${r.amount.toLocaleString()}</div>
      <button class="delete-btn" onclick="deleteReceipt(${r.id})">Delete</button>
    </div>
  `).join('');
}

// ========== MODAL OPENERS ==========
function openInvoiceModal() {
  document.getElementById('inv-modal-title').textContent = 'New Invoice';
  document.getElementById('inv-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('inv-due').value = '';
  document.getElementById('inv-status').value = 'pending';
  document.getElementById('inv-line-items').innerHTML = '';
  addInvoiceLine(); // add one empty line
  populateCustomerSelect('inv-customer');
  updateInvoiceTotal();
  openModal('invoice');
}
function openQuotationModal() {
  document.getElementById('quot-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('quot-valid').value = '';
  document.getElementById('quot-line-items').innerHTML = '';
  addQuotationLine();
  populateCustomerSelect('quot-customer');
  updateQuotationTotal();
  openModal('quotation');
}
function openReceiptModal() {
  document.getElementById('rec-amount').value = '';
  document.getElementById('rec-note').value = '';
  populateCustomerSelect('rec-customer');
  openModal('receipt');
}

function populateCustomerSelect(selectId) {
  const sel = document.getElementById(selectId);
  sel.innerHTML = '<option value="">Select client…</option>' + customers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
}

// ========== LINE ITEMS MANAGEMENT ==========
function addInvoiceLine(desc='', qty=1, price=0) {
  const container = document.getElementById('inv-line-items');
  const idx = container.children.length;
  const row = document.createElement('div');
  row.className = 'line-item-row';
  row.innerHTML = `
    <input type="text" placeholder="Item description" value="${escapeHtml(desc)}" oninput="updateInvoiceTotal()" style="flex:2">
    <input type="number" placeholder="Qty" value="${qty}" min="1" oninput="updateInvoiceTotal()" style="flex:1">
    <input type="number" placeholder="Price" value="${price}" step="any" oninput="updateInvoiceTotal()" style="flex:1">
    <button onclick="this.parentElement.remove(); updateInvoiceTotal();">✕</button>
  `;
  container.appendChild(row);
  updateInvoiceTotal();
}
function addQuotationLine(desc='', qty=1, price=0) {
  const container = document.getElementById('quot-line-items');
  const row = document.createElement('div');
  row.className = 'line-item-row';
  row.innerHTML = `
    <input type="text" placeholder="Item description" value="${escapeHtml(desc)}" oninput="updateQuotationTotal()" style="flex:2">
    <input type="number" placeholder="Qty" value="${qty}" min="1" oninput="updateQuotationTotal()" style="flex:1">
    <input type="number" placeholder="Price" value="${price}" step="any" oninput="updateQuotationTotal()" style="flex:1">
    <button onclick="this.parentElement.remove(); updateQuotationTotal();">✕</button>
  `;
  container.appendChild(row);
  updateQuotationTotal();
}
function calcLineItemsTotal(containerId) {
  let total = 0;
  document.querySelectorAll(`#${containerId} .line-item-row`).forEach(row=>{
    const inputs = row.querySelectorAll('input');
    const qty = parseFloat(inputs[1].value) || 0;
    const price = parseFloat(inputs[2].value) || 0;
    total += qty * price;
  });
  return total;
}
function updateInvoiceTotal() {
  const total = calcLineItemsTotal('inv-line-items');
  document.getElementById('inv-total-display').textContent = 'KES '+total.toLocaleString();
}
function updateQuotationTotal() {
  const total = calcLineItemsTotal('quot-line-items');
  document.getElementById('quot-total-display').textContent = 'KES '+total.toLocaleString();
}

// ========== SAVE DOCUMENTS ==========
async function saveInvoice() {
  const custId = document.getElementById('inv-customer').value;
  if(!custId) return alert('Select a customer');
  const cust = customers.find(c=>c.id==custId);
  const date = document.getElementById('inv-date').value;
  const dueDate = document.getElementById('inv-due').value;
  const status = document.getElementById('inv-status').value;
  const lineItems = [];
  document.querySelectorAll('#inv-line-items .line-item-row').forEach(row=>{
    const inputs = row.querySelectorAll('input');
    lineItems.push({desc:inputs[0].value, qty:parseFloat(inputs[1].value)||0, price:parseFloat(inputs[2].value)||0});
  });
  const total = calcLineItemsTotal('inv-line-items');
  const invoice = {customerId:custId, customerName:cust.name, date, dueDate, status, lineItems, total, createdAt:new Date().toISOString()};
  await addItem('invoices', invoice);
  await refreshData();
  cm('invoice');
}
async function saveQuotation() {
  const custId = document.getElementById('quot-customer').value;
  if(!custId) return alert('Select a customer');
  const cust = customers.find(c=>c.id==custId);
  const date = document.getElementById('quot-date').value;
  const validUntil = document.getElementById('quot-valid').value;
  const lineItems = [];
  document.querySelectorAll('#quot-line-items .line-item-row').forEach(row=>{
    const inputs = row.querySelectorAll('input');
    lineItems.push({desc:inputs[0].value, qty:parseFloat(inputs[1].value)||0, price:parseFloat(inputs[2].value)||0});
  });
  const total = calcLineItemsTotal('quot-line-items');
  const quotation = {customerId:custId, customerName:cust.name, date, validUntil, lineItems, total, createdAt:new Date().toISOString()};
  await addItem('quotations', quotation);
  await refreshData();
  cm('quotation');
}
async function saveReceipt() {
  const custId = document.getElementById('rec-customer').value;
  if(!custId) return alert('Select a customer');
  const cust = customers.find(c=>c.id==custId);
  const amount = parseFloat(document.getElementById('rec-amount').value);
  if(!amount) return alert('Enter amount');
  const method = document.getElementById('rec-method').value;
  const note = document.getElementById('rec-note').value;
  const receipt = {customerId:custId, customerName:cust.name, amount, method, note, date:new Date().toISOString()};
  await addItem('receipts', receipt);
  await refreshData();
  cm('receipt');
}

// ========== DELETE ==========
async function deleteInvoice(id){ if(confirm('Delete invoice?')){ await deleteItem('invoices',id); await refreshData(); } }
async function deleteQuotation(id){ if(confirm('Delete quotation?')){ await deleteItem('quotations',id); await refreshData(); } }
async function deleteReceipt(id){ if(confirm('Delete receipt?')){ await deleteItem('receipts',id); await refreshData(); } }

// ========== RENDER ALL (extend) ==========
function renderAll() {
  renderDashboard(); renderSales(); renderProducts(); renderAnalytics();
  renderCustomers(); renderExpenses();
  renderInvoices(); renderQuotations(); renderReceipts();
}

// ========== TAB SWITCHING (extend for new tabs) ==========
function switchTab(t) {
  curTab = t;
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  document.getElementById(`pane-${t}`).classList.add('on');
  document.querySelectorAll('.nitem').forEach(n=>n.classList.remove('on'));
  document.querySelector(`.nitem[onclick*="'${t}'"]`).classList.add('on');
  const isMobile = window.innerWidth<768;
  document.getElementById('fab').style.display = isMobile && ['sales','products','expenses','invoices','quotations','receipts'].includes(t) ? 'flex' : 'none';
  if(t==='invoices') renderInvoices();
  if(t==='quotations') renderQuotations();
  if(t==='receipts') renderReceipts();
  if(t==='analytics') renderAnalytics();
  if(t==='customers') renderCustomers();
  if(t==='sales') renderSales();
  if(t==='products') renderProducts();
}

// ========== FAB ==========
function fabClick() {
  if(curTab==='invoices') openInvoiceModal();
  else if(curTab==='quotations') openQuotationModal();
  else if(curTab==='receipts') openReceiptModal();
  else if(curTab==='sales') openNewSale();
  else if(curTab==='products') openModal('product');
  else if(curTab==='expenses') openModal('expense');
}
