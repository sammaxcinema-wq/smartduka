<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Smart Duka · Premium POS & Invoices</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0B0B0B; --s1: #0C1310; --s2: #121A14; --s3: #182019;
            --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.12);
            --gold: #C8883A; --gold2: #E9B96E; --gold3: rgba(200,136,58,0.15);
            --em: #0A9167; --em2: #34D399; --rose: #E54562; --sapp: #4A9EDF;
            --text: #EDF0EE; --text2: #C8D4CB; --muted: #526659; --muted2: #8CA396;
            --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Outfit', system-ui, sans-serif;
            --r: 20px; --r2: 14px; --r3: 10px;
            --sidebar-w: 250px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--sans); background: #050807; color: var(--text); min-height: 100vh; overflow-x: hidden; }
        #app { display: flex; min-height: 100vh; position: relative; }
        /* Sidebar Desktop */
        .sidebar { width: var(--sidebar-w); background: rgba(8,12,10,0.96); backdrop-filter: blur(30px); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 0; position: fixed; top: 0; left: 0; bottom: 0; z-index: 40; transition: transform 0.3s ease; }
        .sidebar .logo { padding: 0 24px 30px; border-bottom: 1px solid var(--border); margin-bottom: 20px; font-family: var(--serif); font-size: 28px; color: var(--text); }
        .sidebar .logo em { color: var(--gold); font-style: italic; }
        .side-nav { flex: 1; padding: 0 12px; overflow-y: auto; }
        .side-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; color: var(--muted2); font-weight: 500; font-size: 14px; cursor: pointer; margin-bottom: 2px; transition: 0.2s; border: none; background: transparent; width: 100%; text-align: left; }
        .side-item.on { background: rgba(200,136,58,0.12); color: var(--gold2); }
        .side-item i { font-style: normal; font-size: 18px; }
        /* Main */
        .main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; }
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); z-index: 100; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
        }
        .mobile-header { display: none; align-items: center; padding: 12px 16px; background: rgba(5,8,7,0.95); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 35; border-bottom: 1px solid var(--border); }
        @media (max-width: 1024px) { .mobile-header { display: flex; } }
        .content { padding: 20px 24px 80px; flex: 1; }
        @media (max-width: 768px) { .content { padding: 12px 16px 100px; } }
        .pane { display: none; flex-direction: column; gap: 16px; animation: fadeSlide 0.3s ease; }
        .pane.on { display: flex; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(12px); } }
        .glass-card { background: rgba(12,19,16,0.75); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; }
        .btn { border: none; border-radius: 100px; padding: 12px 20px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; background: var(--s2); color: var(--text2); transition: all 0.2s; }
        .btn-gold { background: linear-gradient(135deg, var(--gold), #A86E28); color: #0A0600; }
        .btn-em { background: linear-gradient(135deg, var(--em), #076B4E); color: #fff; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--em); color: #fff; padding: 14px 24px; border-radius: 40px; font-weight: 600; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.4); animation: toastIn 0.3s ease; }
        @keyframes toastIn { from { transform: translateY(20px); opacity: 0; } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.on { display: flex; }
        .modal-sheet { background: rgba(10,15,11,0.98); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px 28px 0 0; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 24px; animation: slideUp 0.3s ease; }
        @media (min-width: 768px) { .modal-sheet { border-radius: 28px; margin: auto; } }
        @keyframes slideUp { from { transform: translateY(100%); } }
        .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .bottom-nav { position: fixed; bottom: 16px; left: 16px; right: 16px; background: rgba(8,12,10,0.9); backdrop-filter: blur(30px); border: 1px solid var(--border2); border-radius: 30px; display: flex; justify-content: space-around; padding: 8px; z-index: 50; display: none; }
        @media (max-width: 1024px) { .bottom-nav { display: flex; } }
        .bottom-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px; color: var(--muted); font-size: 10px; font-weight: 600; border: none; background: transparent; }
        .bottom-nav-item.on { color: var(--gold); background: var(--gold3); border-radius: 20px; }
        .invoice-paper { background: #fff; color: #111; border-radius: 12px; padding: 20px; max-width: 400px; margin: auto; font-family: 'Courier New', monospace; }
        @media print { body * { visibility: hidden; } .invoice-paper, .invoice-paper * { visibility: visible; } .invoice-paper { position: absolute; left: 0; top: 0; width: 100%; } }
        .qr-container { display: flex; justify-content: center; margin: 10px 0; }
        /* Animations */
        .scale-in { animation: scaleIn 0.25s ease; }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } }
    </style>
</head>
<body>
<div id="app">
    <aside class="sidebar" id="sidebar">
        <div class="logo">Smart <em>Duka</em></div>
        <nav class="side-nav" id="sideNav"></nav>
    </aside>
    <div class="main">
        <div class="mobile-header">
            <button class="btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
            <span style="font-family:var(--serif);font-size:22px">Smart <em style="color:var(--gold)">Duka</em></span>
        </div>
        <div class="content" id="mainContent"></div>
    </div>
    <div class="bottom-nav" id="bottomNav"></div>
</div>
<div id="toast" class="toast" style="display:none"></div>
<div class="modal-overlay" id="modalContainer"></div>

<script>
// ---------- DATABASE & STATE ----------
const DB_NAME = 'smartduka_premium_v2';
let db, currentUser = { shopName: 'Smart Duka', till: '123456', paybill: '789012', pochi: '345678' };
let products=[], sales=[], expenses=[], customers=[], customerTxns=[], invoices=[];
let activeTab = 'dashboard', selectedInvoiceTemplate = 'modern';

// ---------- INDEXEDDB ----------
function openDB() {
    return new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, 2);
        req.onupgradeneeded = e => {
            const d = e.target.result;
            ['products','sales','expenses','customers','customerTransactions','invoices'].forEach(s => {
                if(!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath:'id', autoIncrement:true});
            });
        };
        req.onsuccess = e => { db = e.target.result; res(); };
        req.onerror = rej;
    });
}
function getAll(store) { return new Promise(r => { const tx = db.transaction(store,'readonly').objectStore(store).getAll(); tx.onsuccess = () => r(tx.result); }); }
function addItem(store, item) { return new Promise(r => { const tx = db.transaction(store,'readwrite'); const req = tx.objectStore(store).add(item); req.onsuccess = () => r(req.result); }); }
function updateItem(store, item) { return new Promise(r => { const tx = db.transaction(store,'readwrite'); tx.objectStore(store).put(item); tx.oncomplete = () => r(); }); }
function deleteItem(store, id) { return new Promise(r => { const tx = db.transaction(store,'readwrite'); tx.objectStore(store).delete(id); tx.oncomplete = () => r(); }); }

// ---------- HELPERS ----------
const fmt = n => 'KES ' + (n||0).toLocaleString('en-KE');
const escapeHtml = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const genId = () => 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display='block'; t.style.background = type==='error' ? 'var(--rose)' : 'var(--em)';
    setTimeout(() => t.style.display='none', 3000);
}
function openModal(html) {
    const mc = document.getElementById('modalContainer');
    mc.innerHTML = `<div class="modal-sheet">${html}<button class="btn" style="margin-top:20px" onclick="closeModal()">Close</button></div>`;
    mc.classList.add('on');
    mc.onclick = e => { if(e.target===mc) closeModal(); };
}
function closeModal() { document.getElementById('modalContainer').classList.remove('on'); }

// ---------- DATA LOAD ----------
async function loadData() {
    [products, sales, expenses, customers, customerTxns, invoices] = await Promise.all([
        getAll('products'), getAll('sales'), getAll('expenses'), getAll('customers'), getAll('customerTransactions'), getAll('invoices')
    ]);
}
async function seedData() {
    if(products.length===0) {
        await addItem('products', {name:'Sugar', unit:'kg', stock_qty:100, low_threshold:10, buying_price:100, selling_price:130});
        await addItem('products', {name:'Unga', unit:'kg', stock_qty:200, low_threshold:20, buying_price:70, selling_price:90});
    }
}

// ---------- UI BUILD ----------
function buildUI() {
    const tabs = [
        {id:'dashboard', icon:'📊', label:'Dashboard'},
        {id:'sales', icon:'🛒', label:'Sales'},
        {id:'invoices', icon:'🧾', label:'Invoices'},
        {id:'products', icon:'📦', label:'Stock'},
        {id:'customers', icon:'👥', label:'Clients'},
        {id:'analytics', icon:'📈', label:'Analytics'},
    ];
    document.getElementById('sideNav').innerHTML = tabs.map(t => `<button class="side-item" onclick="switchTab('${t.id}')"><i>${t.icon}</i> ${t.label}</button>`).join('');
    document.getElementById('bottomNav').innerHTML = tabs.map(t => `<button class="bottom-nav-item" onclick="switchTab('${t.id}')"><span>${t.icon}</span> ${t.label}</button>`).join('');
}
function switchTab(id) {
    activeTab = id;
    document.querySelectorAll('.side-item,.bottom-nav-item').forEach(b => b.classList.remove('on'));
    document.querySelector(`.side-item[onclick="switchTab('${id}')"]`)?.classList.add('on');
    document.querySelector(`.bottom-nav-item[onclick="switchTab('${id}')"]`)?.classList.add('on');
    renderTab(id);
    if(window.innerWidth <=1024) document.getElementById('sidebar').classList.remove('open');
}
function renderTab(id) {
    const c = document.getElementById('mainContent');
    switch(id) {
        case 'dashboard': c.innerHTML = dashboardHTML(); break;
        case 'sales': c.innerHTML = salesHTML(); attachSalesEvents(); break;
        case 'invoices': c.innerHTML = invoicesHTML(); renderInvoiceList(); break;
        case 'products': c.innerHTML = productsHTML(); renderProductList(); break;
        case 'customers': c.innerHTML = customersHTML(); renderCustomerList(); break;
        case 'analytics': c.innerHTML = analyticsHTML(); break;
    }
}

// ---------- DASHBOARD ----------
function dashboardHTML() {
    const rev = sales.reduce((a,b)=>a+b.amount,0);
    return `<div class="glass-card"><h3>Today's Revenue</h3><div style="font-size:36px;font-family:var(--serif)">${fmt(rev)}</div></div>`;
}

// ---------- SALES & INVOICE GENERATION ----------
function salesHTML() {
    return `<div class="glass-card">
        <h3>New Sale</h3>
        <input id="custName" placeholder="Customer name" class="input" style="width:100%;margin:8px 0"><br>
        <select id="prodSelect" style="width:100%;margin:8px 0">${products.map(p=>`<option value="${p.id}">${p.name} (${p.stock_qty} ${p.unit})</option>`)}</select><br>
        <input id="qty" type="number" placeholder="Qty" value="1" style="width:100%;margin:8px 0"><br>
        <input id="amount" type="number" placeholder="Amount (KES)" style="width:100%;margin:8px 0"><br>
        <select id="payMethod" style="width:100%;margin:8px 0"><option value="cash">Cash</option><option value="mpesa">M-Pesa</option><option value="credit">Credit</option></select><br>
        <button class="btn btn-gold" id="recordSaleBtn">✅ Record Sale & Generate Invoice</button>
    </div>
    <div id="lastInvoice" class="glass-card" style="display:none"></div>`;
}
function attachSalesEvents() {
    document.getElementById('recordSaleBtn').onclick = recordSale;
}
async function recordSale() {
    const custName = document.getElementById('custName').value.trim();
    const prodId = parseInt(document.getElementById('prodSelect').value);
    const qty = parseFloat(document.getElementById('qty').value)||1;
    const amount = parseFloat(document.getElementById('amount').value)||0;
    const method = document.getElementById('payMethod').value;
    if(!custName || !amount) return showToast('Fill all fields','error');
    const prod = products.find(p=>p.id===prodId);
    if(prod && prod.stock_qty < qty) return showToast('Not enough stock!','error');
    // deduct stock
    if(prod) { prod.stock_qty -= qty; await updateItem('products', prod); }
    const sale = { product: prod?.name || 'Item', qty, amount, method, customerName: custName, date: new Date().toISOString() };
    sale.id = await addItem('sales', sale);
    // customer credit
    let cust = customers.find(c=>c.name.toLowerCase()===custName.toLowerCase());
    if(!cust) { cust = { name: custName, phone:'', balance:0, credit:0, debit:0 }; cust.id = await addItem('customers', cust); }
    if(method==='credit') { cust.credit += amount; cust.balance = cust.credit - cust.debit; await updateItem('customers', cust); }
    // generate invoice
    const invNum = `INV-${new Date().getFullYear()}-${String(invoices.length+1).padStart(4,'0')}`;
    const invoice = {
        number: invNum, saleId: sale.id, customerName: custName,
        items: [{ name: prod?.name||'Item', qty, price: amount, unit: prod?.unit||'' }],
        total: amount, method, date: new Date().toISOString(), shop: currentUser.shopName, template: selectedInvoiceTemplate
    };
    invoice.id = await addItem('invoices', invoice);
    invoices.push(invoice);
    showInvoicePreview(invoice);
    showToast('Invoice generated!');
    loadData();
}
function showInvoicePreview(inv) {
    const div = document.getElementById('lastInvoice');
    div.style.display = 'block';
    div.innerHTML = renderInvoiceHTML(inv) + `<div class="flex-row"><button class="btn btn-em" onclick="printInvoice(${inv.id})">🖨️ Print</button>
    <button class="btn" onclick="shareWhatsApp(${inv.id})">📲 WhatsApp</button>
    <button class="btn" onclick="downloadPDF(${inv.id})">📄 PDF</button></div>`;
}

// ---------- INVOICE RENDERING ----------
function renderInvoiceHTML(inv) {
    const items = inv.items.map(i => `<tr><td>${i.name}</td><td>${i.qty} ${i.unit||''}</td><td>${fmt(i.price)}</td></tr>`).join('');
    const qrId = 'qr-'+inv.id;
    setTimeout(() => {
        const qrEl = document.getElementById(qrId);
        if(qrEl) new QRCode(qrEl, { text: `INV:${inv.number}`, width: 60, height: 60 });
    }, 100);
    return `<div class="invoice-paper" id="invoice-${inv.id}">
        <h3 style="text-align:center">${inv.shop}</h3>
        <p style="text-align:center">${inv.number} | ${new Date(inv.date).toLocaleString()}</p>
        <hr><p><b>Customer:</b> ${inv.customerName}</p>
        <table style="width:100%"><tr><th>Item</th><th>Qty</th><th>Price</th></tr>${items}</table>
        <hr><p><b>Total:</b> ${fmt(inv.total)} | <b>Method:</b> ${inv.method}</p>
        <p style="text-align:center">Thank you!</p>
        <div class="qr-container" id="${qrId}"></div>
    </div>`;
}
async function printInvoice(id) {
    const inv = invoices.find(i=>i.id===id); if(!inv) return;
    const win = window.open('','','width=400,height=600');
    win.document.write(`<html><head><title>Invoice</title><style>body{font-family:monospace} .invoice-paper{max-width:300px;margin:auto}</style></head><body>${renderInvoiceHTML(inv)}</body></html>`);
    win.document.close();
    setTimeout(() => { win.print(); win.close(); }, 500);
}
async function downloadPDF(id) {
    const inv = invoices.find(i=>i.id===id); if(!inv) return;
    const el = document.createElement('div'); el.innerHTML = renderInvoiceHTML(inv);
    document.body.appendChild(el);
    await html2pdf().set({margin:0,filename:`invoice-${inv.number}.pdf`}).from(el).save();
    document.body.removeChild(el);
}
function shareWhatsApp(id) {
    const inv = invoices.find(i=>i.id===id); if(!inv) return;
    const cust = customers.find(c=>c.name===inv.customerName);
    const phone = cust?.phone || prompt('Enter customer phone (2547...):');
    if(!phone) return;
    const msg = `🧾 *Invoice ${inv.number}*\n👤 ${inv.customerName}\n💰 Total: ${fmt(inv.total)}\n📅 ${new Date(inv.date).toLocaleDateString()}\n🏪 ${currentUser.shopName}\n🙏 Thank you!`;
    window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');
}

// ---------- INVOICE HISTORY ----------
function invoicesHTML() { return `<div class="glass-card"><h3>Invoice History</h3><div id="invoiceList"></div></div>`; }
function renderInvoiceList() {
    const list = document.getElementById('invoiceList');
    if(!list) return;
    list.innerHTML = invoices.slice().reverse().map(inv => `<div style="padding:10px;border-bottom:1px solid var(--border)">
        <b>${inv.number}</b> - ${inv.customerName} | ${fmt(inv.total)} | ${new Date(inv.date).toLocaleDateString()}
        <button onclick="viewInvoice(${inv.id})" class="btn" style="margin-left:10px">View</button>
    </div>`).join('');
}
function viewInvoice(id) {
    const inv = invoices.find(i=>i.id===id); if(!inv) return;
    openModal(renderInvoiceHTML(inv) + `<button onclick="printInvoice(${id})">Print</button><button onclick="shareWhatsApp(${id})">WhatsApp</button>`);
}

// ---------- PRODUCTS ----------
function productsHTML() { return `<div class="glass-card"><h3>Inventory</h3><div id="prodList"></div><button class="btn btn-gold" onclick="addProductUI()">+ Add Product</button></div>`; }
function renderProductList() {
    const list = document.getElementById('prodList');
    if(!list) return;
    list.innerHTML = products.map(p => `<div>${p.name} - ${p.stock_qty} ${p.unit} | Sell: ${p.selling_price}</div>`).join('');
}
async function addProductUI() {
    const name = prompt('Product name'); const unit = prompt('Unit (kg, pcs)'); const qty = parseFloat(prompt('Stock')); const buy = parseFloat(prompt('Buy price')); const sell = parseFloat(prompt('Sell price'));
    if(name) { await addItem('products', {name, unit, stock_qty: qty, low_threshold: Math.max(5,qty*0.1), buying_price: buy, selling_price: sell}); loadData(); renderProductList(); }
}

// ---------- CUSTOMERS ----------
function customersHTML() { return `<div class="glass-card"><h3>Clients</h3><div id="custList"></div></div>`; }
function renderCustomerList() {
    const list = document.getElementById('custList');
    if(!list) return;
    list.innerHTML = customers.map(c => `<div>${c.name} | Balance: ${fmt(c.balance||0)}</div>`).join('');
}

// ---------- ANALYTICS ----------
function analyticsHTML() {
    const rev = sales.reduce((a,b)=>a+b.amount,0);
    const profit = rev*0.28 - expenses.reduce((a,b)=>a+b.amount,0);
    return `<div class="glass-card"><h3>Analytics</h3><p>Revenue: ${fmt(rev)}</p><p>Profit: ${fmt(profit)}</p></div>`;
}

// ---------- KEYBOARD SHORTCUTS ----------
document.addEventListener('keydown', e => {
    if(e.ctrlKey && e.key==='n') { e.preventDefault(); switchTab('sales'); document.getElementById('recordSaleBtn')?.focus(); }
    if(e.ctrlKey && e.key==='p') { e.preventDefault(); const last = invoices[invoices.length-1]; if(last) printInvoice(last.id); }
});

// ---------- INIT ----------
(async function init() {
    await openDB();
    await loadData();
    await seedData();
    await loadData();
    buildUI();
    switchTab('dashboard');
    window.addEventListener('resize', () => {
        if(window.innerWidth>1024) document.getElementById('sidebar').classList.remove('open');
    });
})();
</script>
</body>
</html>
